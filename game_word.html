<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Русский Wordle</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: #121213;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1, h2 {
      color: #d7dadc;
    }

    button {
      margin: 10px;
      padding: 12px 24px;
      font-size: 1em;
      background-color: #538d4e;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #6aaa64;
    }

    #board {
      display: grid;
      gap: 6px;
      justify-content: center;
      margin: 20px auto;
    }

    .row {
      display: grid;
      gap: 6px;
      justify-content: center;
    }

    .cell {
      width: 60px;
      height: 60px;
      border: 2px solid #3a3a3c;
      text-transform: uppercase;
      font-size: 2em;
      text-align: center;
      line-height: 60px;
      font-weight: bold;
      background-color: #121213;
      color: white;
      transition: background-color 0.3s ease, transform 0.3s ease;
    }

    .correct {
      background-color: #538d4e;
      border-color: #538d4e;
      animation: bounce 0.4s;
    }

    .present {
      background-color: #b59f3b;
      border-color: #b59f3b;
      animation: bounce 0.4s;
    }

    .absent {
      background-color: #3a3a3c;
      border-color: #3a3a3c;
      animation: fadeIn 0.4s;
    }

    input[type="text"] {
      padding: 10px;
      font-size: 1em;
      width: 200px;
      text-align: center;
      text-transform: uppercase;
      margin-top: 10px;
      background: #1a1a1b;
      color: #fff;
      border: 2px solid #3a3a3c;
      border-radius: 6px;
    }

    #message {
      margin-top: 10px;
      font-size: 1.1em;
      color: #ffffff;
      min-height: 1.4em;
    }

    /* Панель очков и подсказок */
    #scorebar {
      margin: 8px auto 8px;
      font-size: .95rem;
      color: #9aa0a6;
    }
    #hintText {
      margin-top: 6px;
      color: #c7d5c8;
      font-size: 0.95em;
      min-height: 1.2em;
    }
    .badge {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #2b2c2e;
      font-weight: 700;
    }
    .badge.plus { color:#9be28a; }
    .badge.minus{ color:#ff8b8b; }

    @keyframes bounce {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="menu">
    <h1>Русский Wordle</h1>
    <p>Выбери уровень сложности:</p>
    <button onclick="startGame(4)">Легкий (4 буквы)</button>
    <button onclick="startGame(5)">Средний (5 букв)</button>
    <button onclick="startGame(6)">Сложный (6 букв)</button>
  </div>

    <button onclick="submitGuess()">Проверить</button>

    function updateScoreUI() {
      const g = (id) => document.getElementById(id);
      g('scoreTotal') && (g('scoreTotal').textContent = stats.points);
      g('scoreStreak') && (g('scoreStreak').textContent = stats.streak);
      g('scoreWins') && (g('scoreWins').textContent = stats.wins);
      g('scoreLosses') && (g('scoreLosses').textContent = stats.losses);
    }
    function showDelta(delta) {
      const bar = document.getElementById('scorebar');
      if (!bar) return;
      const b = document.createElement('span');
      b.className = 'badge ' + (delta >= 0 ? 'plus' : 'minus');
      b.textContent = (delta >= 0 ? '+' : '') + delta;
      bar.appendChild(b);
      setTimeout(()=> b.remove(), 2500);
    }

    const VOWELS = new Set(['а','е','и','о','у','ы','э','ю','я']);
    const CONSONANTS = new Set(['б','в','г','д','ж','з','к','л','м','н','п','р','с','т','ф','х','ц','ч','ш','щ','й']);
    let hintStage = 0; // сколько подсказок уже показано для текущего слова

    function uniqueLetters(word) {
      const seen = new Set(); const out = [];
      for (const ch of word) if (!seen.has(ch)) { seen.add(ch); out.push(ch); }
      return out;
    }
    function autoHint(word, stage) {
      const w = word; // уже в нижнем регистре
      const first = w[0].toUpperCase();
      const last  = w[w.length - 1].toUpperCase();

      let vowels = 0, consonants = 0;
      const counts = {};
      for (const ch of w) {
        if (VOWELS.has(ch)) vowels++; else if (CONSONANTS.has(ch)) consonants++;
        counts[ch] = (counts[ch] || 0) + 1;
      }
      const dup = Object.keys(counts).find(k => counts[k] > 1);
      const uniq = uniqueLetters(w);

      const variants = [
        `Начинается на «${first}».`,
        `Заканчивается на «${last}».`,
        `Гласных: ${vowels}, согласных: ${consonants}.`,
        dup ? `Есть повтор буквы «${dup.toUpperCase()}».` : `Все буквы разные.`,
        `Есть буквы: ${uniq.slice(0, Math.min(3, uniq.length)).map(x => '«'+x.toUpperCase()+'»').join(', ')}.`
      ];
      return variants[Math.min(stage, variants.length - 1)];
    }
    function showInitialHint() {
      hintStage = 1; // первая подсказка бесплатная
      const txt = autoHint(targetWord, 0);
      const el = document.getElementById('hintText');
      if (el) el.textContent = 'Подсказка: ' + txt;
    }
    function nextHint() {
      const txt = autoHint(targetWord, hintStage);
      hintStage++;
      const el = document.getElementById('hintText');
      if (el) el.textContent = 'Подсказка: ' + txt;
    }

    /* ---------- игровая логика ---------- */
    let targetWord = "";
    let wordLength = 5;
    let currentTry = 0;
    let maxTries = 6;

    function startGame(length) {
      wordLength = length;
      currentTry = 0;
      maxTries = 6;
      hintStage = 0;

      const words = wordLists[length];
      targetWord = words[Math.floor(Math.random() * words.length)].toLowerCase();

      document.getElementById("menu").style.display = "none";
      document.getElementById("game").style.display = "block";
      document.getElementById("levelTitle").textContent = `Уровень: ${length} букв`;

      createBoard();
      resetGameState();
      showInitialHint();
    }

    function createBoard() {
      const board = document.getElementById("board");
      board.innerHTML = "";
      board.style.gridTemplateRows = `repeat(${maxTries}, 1fr)`;

      for (let i = 0; i < maxTries; i++) {
        const row = document.createElement("div");
        row.classList.add("row");
        row.style.gridTemplateColumns = `repeat(${wordLength}, 1fr)`;
        for (let j = 0; j < wordLength; j++) {
          const cell = document.createElement("div");
          cell.classList.add("cell");
          row.appendChild(cell);
        }
        board.appendChild(row);
      }
    }

    function resetGameState() {
      document.getElementById("guessInput").value = "";
      document.getElementById("guessInput").disabled = false;
      document.getElementById("message").textContent = "";
      const ht = document.getElementById("hintText");
      if (ht) ht.textContent = "";
    }

    function submitGuess() {
      const input = document.getElementById("guessInput");
      const guess = input.value.trim().toLowerCase();

      if (guess.length !== wordLength) {
        alert(`Введите слово из ${wordLength} букв`);
        return;
      }

      if (!wordLists[wordLength].includes(guess)) {
        alert("Такого слова нет в словаре");
        return;
      }

      const row = document.getElementById("board").children[currentTry];
      const letterCount = {};

      for (const char of targetWord) {
        letterCount[char] = (letterCount[char] || 0) + 1;
      }

      // Первая проходка: правильные позиции
      for (let i = 0; i < wordLength; i++) {
        const cell = row.children[i];
        cell.textContent = guess[i] ? guess[i].toUpperCase() : '';
        if (guess[i] === targetWord[i]) {
          cell.classList.add("correct");
          letterCount[guess[i]]--;
        }
      }

      // Вторая проходка: неправильные позиции
      for (let i = 0; i < wordLength; i++) {
        const cell = row.children[i];
        if (!cell.classList.contains("correct")) {
          if (targetWord.includes(guess[i]) && letterCount[guess[i]] > 0) {
            cell.classList.add("present");
            letterCount[guess[i]]--;
          } else {
            cell.classList.add("absent");
          }
        }
      }

      if (guess === targetWord) {
        // очки за победу
        const triesUsed = currentTry + 1;
        const remaining = Math.max(0, maxTries - triesUsed);
        const paidHints = Math.max(0, hintStage - SCORE_CFG.FREE_HINTS);
        let delta = SCORE_CFG.WIN_BASE + remaining * SCORE_CFG.WIN_PER_REMAIN - paidHints * SCORE_CFG.HINT_PENALTY;
        if (delta < 1) delta = 1;

        stats.points += delta;
        stats.wins++; stats.games++; stats.streak++; stats.bestStreak = Math.max(stats.bestStreak, stats.streak);
        saveStats(); updateScoreUI(); showDelta(delta);

        document.getElementById("message").textContent = `🎉 Победа! +${delta} очков (подсказок: ${paidHints})`;
        document.getElementById("guessInput").disabled = true;
        animateVictory(row);
        return;
      }

      currentTry++;
      if (currentTry === maxTries) {
        const delta = SCORE_CFG.LOSS;
        stats.points += delta;
        stats.losses++; stats.games++; stats.streak = 0;
        saveStats(); updateScoreUI(); showDelta(delta);

        document.getElementById("message").textContent = `😢 Вы проиграли. Слово: "${targetWord.toUpperCase()}" (${delta} очков)`;
        document.getElementById("guessInput").disabled = true;
      }

      input.value = "";
    }

    function restartGame() {
      document.getElementById("menu").style.display = "block";
      document.getElementById("game").style.display = "none";
    }

    function animateVictory(row) {
      for (let i = 0; i < row.children.length; i++) {
        const cell = row.children[i];
        cell.style.animation = "bounce 0.6s ease " + i * 0.1 + "s forwards";
      }
    }

    document.getElementById("guessInput").addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        submitGuess();
      }
    });

    // Загружаем статистику при открытии
    window.addEventListener('DOMContentLoaded', loadStats);
  </script>
</body>
</html>
